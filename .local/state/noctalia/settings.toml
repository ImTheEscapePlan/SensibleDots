config_version = 8

[bar.default]
background_opacity = 0.69999998435378075
center = [ "workspaces" ]
concave_edge_corners = false
end = [
    "widget",
    "tray",
    "notifications",
    "network",
    "clipboard",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session",
    "control-center"
]
font_family = "Iosevka Extended"
start = [ "launcher", "wallpaper", "clock", "media" ]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
concave_edge_corners = false
enabled = true
icon_size = 30
launcher_position = "start"
main_axis_padding = 12
reserve_space = false
show_dots = true

[location]
address = "Mildura, Australia"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-4", "lockscreen-login-box@HDMI-A-4" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-4"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-4"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 842.0
    output = "HDMI-A-4"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-4".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "yuuto/arch-updater" ]

[shell]
font_family = "Iosevka Extended"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "hyprland", "kitty" ]
    community_ids = [ "pywalfox", "discord", "neovim", "fastfetch", "yazi" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/ctrlescape/Pictures/Wallpapers/892119-2538x1800-desktop-hd-serial-experiments-lain-background-photo.jpg"

    [wallpaper.last]
    path = "/home/ctrlescape/Pictures/Wallpapers/892119-2538x1800-desktop-hd-serial-experiments-lain-background-photo.jpg"

    [wallpaper.monitors.DP-4]
    path = "/home/ctrlescape/Pictures/Wallpapers/892119-2538x1800-desktop-hd-serial-experiments-lain-background-photo.jpg"

    [wallpaper.monitors.HDMI-A-4]
    path = "/home/ctrlescape/Pictures/Wallpapers/892119-2538x1800-desktop-hd-serial-experiments-lain-background-photo.jpg"

[widget.network]
show_label = false

[widget.widget]
type = "yuuto/arch-updater:widget"